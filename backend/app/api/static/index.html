<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="watchtower-token" content="__SESSION_TOKEN__">
  <title>Watchtower · Intelligence Dashboard</title>
  <meta name="description" content="Watchtower local intelligence monitoring and audit dashboard">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f172a'/%3E%3Cpath d='M7 8l4 17 5-10 5 10 4-17' fill='none' stroke='%2338bdf8' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside class="rail">
    <div class="brand">
      <span class="brandmark">W</span>
      <div>
        WATCHTOWER
        <small>INTELLIGENCE DESK</small>
      </div>
    </div>
    <nav id="navigation" aria-label="Navigation"></nav>
    <div class="rail-footer-card">
      <div class="rail-status-row">
        <span class="pulse-dot"></span>
        <span>System Active</span>
      </div>
      <p class="rail-note">All times displayed in IST (India Standard Time)</p>
    </div>
    <span class="version">v0.3.2</span>
  </aside>

  <main>
    <header>
      <div class="header-titles">
        <p class="eyebrow">WATCHTOWER INTELLIGENCE</p>
        <h1 id="view-title">Dashboard</h1>
      </div>
      <div class="header-actions">
        <span id="run-state" class="pill">Loading</span>
      </div>
    </header>

    <div id="notice" role="status" aria-live="polite"></div>
    <div id="views"></div>

    <footer>
      <span>Watchtower Local Intelligence · All timestamps in IST · Bounded public-information collection</span>
    </footer>
  </main>

  <dialog id="detail-dialog">
    <div class="dialog-heading">
      <h2 id="dialog-title">Details</h2>
      <button id="close-dialog" class="btn-close" aria-label="Close">&times;</button>
    </div>
    <div id="dialog-body"></div>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>

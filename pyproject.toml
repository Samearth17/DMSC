[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchtower-monitor"
version = "0.3.0"
description = "Configurable public-information discovery with traceable audits"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7", "tzdata>=2025.2"]

[project.optional-dependencies]
youtube = ["yt-dlp>=2025.1.26"]
instagram = ["instaloader>=4.15.3,<5"]
all = ["yt-dlp>=2026.8.19", "instaloader>=4.15.3,<5"]

[project.scripts]
watchtower = "app.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
"app.api" = ["static/*.html", "static/*.css", "static/*.js"]
